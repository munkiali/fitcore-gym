<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITCORE GYM | Management System</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0d0d0d;
    color:#fff;
    display:flex;
}

/* SIDEBAR */
.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    background:#151515;
    border-right:1px solid #292929;
    padding:25px 18px;
    overflow-y:auto;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00e5ff;
    margin-bottom:45px;
}

.logo span{color:#fff;}

.menu{list-style:none;}
.menu li{margin-bottom:10px;}

.menu a{
    display:block;
    padding:14px;
    color:#aaa;
    text-decoration:none;
    border-radius:10px;
    cursor:pointer;
    transition:.2s;
}

.menu a:hover,
.menu a.active{
    background:#00e5ff;
    color:#000;
}

/* MAIN */
.main{
    margin-left:260px;
    width:calc(100% - 260px);
    padding:30px;
    min-height:100vh;
}

.hidden{
    display:none!important;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.header h1{
    font-size:28px;
}

.header p{
    color:#888;
    margin-top:6px;
}

.profile{
    background:#181818;
    padding:10px 15px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#00e5ff;
    color:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

/* DASHBOARD CARDS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.card,
.panel{
    background:#171717;
    border:1px solid #292929;
    border-radius:16px;
    padding:22px;
}

.card-icon{
    font-size:28px;
    margin-bottom:15px;
}

.card p{
    color:#888;
}

.card h2{
    margin-top:8px;
    font-size:28px;
}

/* CONTENT */
.content{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
    margin-top:25px;
}

.panel h3{
    margin-bottom:20px;
}

/* RECENT MEMBERS */
.member{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #292929;
}

.member:last-child{
    border-bottom:none;
}

.member-info{
    display:flex;
    align-items:center;
    gap:12px;
}

.member-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#292929;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

small{
    color:#888;
}

/* STATUS */
.status{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    display:inline-block;
}

.active-status{
    background:rgba(0,229,255,.12);
    color:#00e5ff;
}

.due-status{
    background:rgba(255,77,77,.12);
    color:#ff6464;
}

/* BUTTONS */
button{
    border:none;
    cursor:pointer;
    transition:.2s;
}

.action-btn,
.primary-btn{
    background:#222;
    color:#fff;
    padding:14px;
    border-radius:10px;
}

.primary-btn{
    background:#00e5ff;
    color:#000;
    font-weight:bold;
}

.primary-btn:hover{
    opacity:.85;
}

.action-btn:hover{
    background:#00e5ff;
    color:#000;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* TOP ACTIONS */
.top-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    gap:15px;
}

.search,
.date-input,
.filter-select{
    background:#171717;
    border:1px solid #333;
    color:#fff;
    padding:12px;
    border-radius:10px;
}

.search{
    width:260px;
}

/* TABLE */
.table-wrapper{
    overflow-x:auto;
}

.member-table{
    width:100%;
    border-collapse:collapse;
}

.member-table th,
.member-table td{
    padding:15px;
    border-bottom:1px solid #292929;
    text-align:left;
}

.member-table th{
    color:#888;
    font-size:14px;
}

/* IMPROVED EDIT / DELETE BUTTONS */
.member-table td:last-child{
    white-space:nowrap;
}

.edit-btn,
.delete-btn{
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    font-weight:600;
    margin:2px;
    transition:all .2s ease;
}

.edit-btn{
    background:rgba(0,229,255,.12);
    color:#00e5ff;
    border:1px solid rgba(0,229,255,.35);
}

.edit-btn:hover{
    background:#00e5ff;
    color:#000;
    transform:translateY(-1px);
}

.delete-btn{
    background:rgba(255,77,77,.12);
    color:#ff6464;
    border:1px solid rgba(255,77,77,.35);
}

.delete-btn:hover{
    background:#ff4d4d;
    color:#fff;
    transform:translateY(-1px);
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:15px;
}

.modal-box{
    background:#171717;
    padding:25px;
    border-radius:16px;
    width:420px;
    max-width:100%;
    max-height:90vh;
    overflow-y:auto;
    border:1px solid #333;
}

.modal-box h2{
    margin-bottom:20px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:12px;
    margin-bottom:12px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:8px;
}

.modal-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
}

/* ATTENDANCE */
.attendance-summary,
.payment-summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.attendance-card,
.payment-card{
    background:#171717;
    border:1px solid #292929;
    padding:18px;
    border-radius:14px;
}

.attendance-card p,
.payment-card p{
    color:#888;
    margin-bottom:7px;
}

.attendance-card h2,
.payment-card h2{
    font-size:25px;
}

.attendance-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    margin-bottom:10px;
    background:#171717;
    border:1px solid #292929;
    border-radius:12px;
}

.attendance-member{
    display:flex;
    align-items:center;
    gap:12px;
}

.attendance-actions{
    display:flex;
    gap:8px;
}

.present-btn,
.absent-btn{
    padding:9px 13px;
    border-radius:8px;
    color:#fff;
    font-size:13px;
}

.present-btn{
    background:#075e4d;
}

.absent-btn{
    background:#632525;
}

.present-btn.selected{
    outline:2px solid #00e5ff;
}

.absent-btn.selected{
    outline:2px solid #ff7777;
}

/* PAYMENT */
.payment-positive{
    color:#00e5ff;
    font-weight:bold;
}

.payment-date{
    color:#888;
    font-size:13px;
}

.empty{
    text-align:center;
    color:#888;
    padding:30px;
}

/* MOBILE */
@media(max-width:900px){

    .sidebar{
        width:75px;
        padding:25px 10px;
    }

    .logo{
        font-size:0;
    }

    .logo::before{
        content:"💪";
        font-size:28px;
    }

    .menu a{
        font-size:0;
        text-align:center;
    }

    .menu a::first-letter{
        font-size:22px;
    }

    .main{
        margin-left:75px;
        width:calc(100% - 75px);
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .content{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    .main{
        padding:16px;
    }

    .header h1{
        font-size:23px;
    }

    .profile span{
        display:none;
    }

    .top-actions{
        flex-direction:column;
        align-items:stretch;
    }

    .search{
        width:100%;
    }

    .attendance-summary,
    .payment-summary{
        grid-template-columns:1fr;
    }

    .attendance-row{
        flex-direction:column;
        align-items:flex-start;
        gap:12px;
    }

    .attendance-actions{
        width:100%;
    }

    .attendance-actions button{
        flex:1;
    }

    .member-table{
        font-size:12px;
    }

    .member-table th,
    .member-table td{
        padding:10px 6px;
    }

    .modal-actions{
        flex-direction:column;
    }

    .modal-actions button{
        width:100%;
    }
}
</style>
</head>

<body>

    <div class="logo">FIT<span>
